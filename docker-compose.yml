version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sigagro_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sigagro
      MYSQL_USER: admin_sigagro
      MYSQL_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: